services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: repairtrack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - repairtrack_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d repairtrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      database:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@database:5432/repairtrack?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET}
      ACCESS_TOKEN_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 7d
      CLIENT_URL: ${CLIENT_URL:?Set HTTPS CLIENT_URL}
      PUBLIC_API_URL: ${PUBLIC_API_URL:?Set HTTPS PUBLIC_API_URL}
      RESEND_API_KEY: ${RESEND_API_KEY:?Set RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM:?Set verified EMAIL_FROM}
      NOTIFY_USER_ID: ${NOTIFY_USER_ID:-}
      NOTIFY_API_KEY: ${NOTIFY_API_KEY:-}
      NOTIFY_SENDER_ID: ${NOTIFY_SENDER_ID:-NotifyDEMO}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:?Set CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:?Set CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:?Set CLOUDINARY_API_SECRET}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      ERROR_WEBHOOK_URL: ${ERROR_WEBHOOK_URL:-}
    command: ["sh", "-c", "npx prisma migrate deploy && npm start"]
    ports:
      - "5000:5000"
    volumes:
      - repairtrack_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${PUBLIC_API_URL:?Set HTTPS PUBLIC_API_URL}
    depends_on:
      - backend
    ports:
      - "5174:80"

volumes:
  repairtrack_postgres:
  repairtrack_uploads:
